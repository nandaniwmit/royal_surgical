<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A8F6A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Background with subtle rounded shape -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- White Shield Base -->
  <path d="M256 70 C330 70 380 90 380 90 C380 260 256 420 256 420 C256 420 132 260 132 90 C132 90 182 70 256 70 Z" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Medical Plus / Cross -->
  <g filter="url(#shadow)">
    <rect x="220" y="140" width="72" height="210" rx="18" fill="url(#crossGrad)"/>
    <rect x="151" y="209" width="210" height="72" rx="18" fill="url(#crossGrad)"/>
  </g>
  
  <!-- Royal Crown / Surgical Accent on top of cross -->
  <path d="M226 215 L241 245 L256 220 L271 245 L286 215 L286 270 L226 270 Z" fill="#0A8F6A"/>
  <circle cx="256" cy="285" r="4" fill="#0284C7"/>
</svg>